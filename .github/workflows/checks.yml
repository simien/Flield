# Structural checks for a repo with no build step and no test suite. The
# whole of it is .github/scripts/checks.py, which runs the same way on a
# laptop as it does here:
#
#     python3 .github/scripts/checks.py
#
# Nothing is installed. python3 and node are already on the runner, and the
# script has no imports outside the standard library, so there is no lockfile
# to refresh and no action version to keep current.
name: checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The cache-bust check compares this branch against its base, so it
          # needs the base commit present rather than a single-commit clone.
          fetch-depth: 0

      - name: Run checks
        # The cache-bust and link-compat checks need something to diff
        # against. A pull request has its base branch; a push to main has
        # the commit the branch was at before the push, which covers every
        # commit the push carried at once. That SHA is all zeros on a
        # branch's first push and may be gone after a force push, so it
        # is only used when the clone actually has it.
        run: |
          BASE=""
          if [ -n "${{ github.base_ref }}" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            BASE="origin/${{ github.base_ref }}"
          elif git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            BASE="${{ github.event.before }}"
          fi
          python3 .github/scripts/checks.py $BASE

# Structural checks for a repo with no build step and no test suite. The
# whole of it is .github/scripts/checks.py, which runs the same way on a
# laptop as it does here:
#
#     python3 .github/scripts/checks.py
#
# Nothing is installed. python3 and node are already on the runner, and the
# script has no imports outside the standard library, so there is no lockfile
# to refresh and no action version to keep current.
name: checks

on:
  pull_request:
  push:
    branches: [main]

# Read the repo and nothing else, whatever the repository's default token
# permission is set to. Nothing here writes back to GitHub.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The cache-bust check compares this branch against its base, so it
          # needs the base commit present rather than a single-commit clone.
          fetch-depth: 0

      - name: Run checks
        # The cache-bust and link-compat checks need something to diff
        # against. A pull request has its base branch; a push to main has
        # the commit the branch was at before the push, which covers every
        # commit the push carried at once. That SHA is all zeros on a
        # branch's first push and may be gone after a force push, so it
        # is only used when the clone actually has it.
        #
        # The base is fetched at full depth, not --depth=1. A shallow
        # fetch writes .git/shallow and grafts the branch one commit
        # deep, and because the base shares its history with this one
        # that truncates the whole clone: git log -- <file> then reports
        # the graft point rather than the commit that last touched the
        # file, which is what the sitemap-dates check reads. It failed
        # on every page at once the first time a pull request ran after
        # that check was added, naming today's date for files nobody had
        # touched. fetch-depth: 0 above already pays for the history, so
        # there is nothing to save here.
        #
        # Event data reaches the shell through env, never pasted into the
        # script: an expression is substituted before the shell parses
        # anything, so a value that held shell syntax would run as code.
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          BASE=""
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags origin "$BASE_REF"
            BASE="origin/$BASE_REF"
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BASE="$BEFORE"
          fi
          python3 .github/scripts/checks.py $BASE
